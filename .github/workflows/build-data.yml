name: Build dataset

# Builds the browser files in R2 from the processed data (or the synthetic mock).
#   mock: the backend's synthetic dataset (no input files needed)
#   real: reads every per-year Parquet file under real/source/ in the bucket
#         (15 CSV columns), plus real/source/day_status.csv if present
#         (otherwise days with detections count as covered)

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to build'
        type: choice
        options: [mock, real]
        default: mock

permissions:
  contents: read

concurrency:
  group: agni-data-${{ inputs.dataset }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'agni-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Build mock dataset
        if: inputs.dataset == 'mock'
        working-directory: pipeline
        run: python -m agni_pipeline.build_hist --store r2:mock --synthetic
      - name: Build real dataset from the processed CSV
        if: inputs.dataset == 'real'
        working-directory: pipeline
        run: python -m agni_pipeline.build_hist --store r2:real --parquet-prefix source/ --status-key source/day_status.csv
