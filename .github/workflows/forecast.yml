name: Fire forecast (experimental)

# Once a day: forecasts fire detections 1, 3 and 7 days ahead for all of Australia with the ML team's
# forecast model (pipeline/forecast), from the latest fire data in R2, NASA POWER observed weather and
# the Open-Meteo weather forecast. Writes forecast/latest.json and forecast/lead_<L>.parquet to R2.
# Needs forecast/weather_observed.parquet in R2 once (see pipeline/forecast/README.md); the run keeps
# it up to date itself.

on:
  schedule:
    - cron: '40 2 * * *'        # 12:40 in eastern Australia: yesterday's fire-day is in by then
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset prefix in R2'
        default: 'real'
      issue:
        description: 'Issue fire-day YYYY-MM-DD (empty = the newest finished day)'
        default: ''

permissions:
  contents: read

# only one forecast at a time (it doesn't touch manifest.json, so it can run beside the data pipeline)
concurrency:
  group: agni-forecast-${{ inputs.dataset || 'real' }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATASET: ${{ inputs.dataset || 'real' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'agni-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Forecast
        working-directory: pipeline
        env:
          ISSUE: ${{ inputs.issue }}
        run: python -m agni_pipeline.forecast --store "r2:$DATASET" ${ISSUE:+--issue "$ISSUE"}
