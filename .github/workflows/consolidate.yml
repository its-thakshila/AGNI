name: Add processed days to the main dataset

# Nightly: finished days (older than 3 days) move from the live monthly files into the main
# dataset in R2. Run manually with "export CSV" to also rewrite the full processed CSV
# (csv/agni_processed.csv in the same prefix).

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset prefix in R2 (mock or real)'
        default: 'mock'
      export_csv:
        description: 'Also export the full processed CSV'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agni-data-${{ inputs.dataset || vars.AGNI_DATASET || 'mock' }}
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATASET: ${{ inputs.dataset || vars.AGNI_DATASET || 'mock' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'agni-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Consolidate
        working-directory: pipeline
        env:
          EXPORT: ${{ inputs.export_csv && '--export-csv csv/agni_processed.csv' || '' }}
        run: python -m agni_pipeline.consolidate --store "r2:$DATASET" $EXPORT
